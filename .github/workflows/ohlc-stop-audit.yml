name: Fetch Yahoo OHLC for Gap-Aware Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'audit/**'
      - '.github/workflows/ohlc-stop-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-market-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install pandas requests
      - name: Verify manifest came from the uploaded price artifact
        run: |
          python - <<'PY'
          import json
          m=json.load(open('audit/frozen_symbol_manifest.json'))
          assert m['source_prices_sha256']=='64de652ed0617fc70b25a8fd430956faa9c8e7647c855f671d4afe2df891764e'
          assert m['symbol_count']==505
          print(m['start'], m['end'], m['symbol_count'])
          PY
      - name: Fetch and validate raw Yahoo daily OHLC
        run: python -m audit.fetch_yahoo_chart_ohlc
      - name: Upload OHLC artifact
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-daily-ohlc-for-uploaded-prices
          path: |
            audit_artifacts/yahoo_daily_ohlc.pkl
            audit_artifacts/yahoo_daily_ohlc_summary.json
            audit_artifacts/yahoo_ohlc_alignment.csv
          retention-days: 7
