name: Stochastic Fixed-Horizon Frozen Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'audit/stochastic_fixed_horizon.py'
      - 'audit/aggregate_stochastic_fixed_horizon.py'
      - '.github/workflows/stochastic-fixed-horizon-frozen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimize:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [42, 43, 44, 45, 46]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pyarrow scipy tabulate
      - name: Record old snapshot inputs
        run: |
          git rev-parse HEAD
          ls -lh data/candidates_audit_clean.parquet data/prices.pkl data/probs.pkl data/polarity_labels.json
          sha256sum data/candidates_audit_clean.parquet data/prices.pkl data/probs.pkl data/polarity_labels.json
      - name: Compile
        run: python -m compileall -q audit core
      - name: Optimize monthly policies
        run: |
          python -u -m audit.stochastic_fixed_horizon \
            --seed '${{ matrix.seed }}' \
            --iterations 5 \
            --population 120 \
            --run-id 'stochastic_fh_seed_${{ matrix.seed }}'
      - name: Upload seed output
        uses: actions/upload-artifact@v4
        with:
          name: stochastic-fh-old-snapshot-seed-${{ matrix.seed }}
          path: runs/stochastic_fh_seed_${{ matrix.seed }}/
          retention-days: 7

  aggregate:
    needs: optimize
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pyarrow scipy tabulate
      - uses: actions/download-artifact@v4
        with:
          pattern: stochastic-fh-old-snapshot-seed-*
          path: downloaded
      - name: Aggregate without best-seed selection
        run: |
          python -u -m audit.aggregate_stochastic_fixed_horizon \
            --input-root downloaded \
            --output audit_artifacts/stochastic_fixed_horizon
      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: stochastic-fixed-horizon-old-snapshot-results
          path: audit_artifacts/stochastic_fixed_horizon/
          retention-days: 7
