name: Open-aware stop audit data

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "audit/**"
      - ".github/workflows/open-aware-stop-audit-download.yml"

permissions:
  contents: read

jobs:
  download-yahoo-ohlc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install downloader dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "yfinance>=0.2.54" "pandas>=2.2" pyarrow

      - name: Download raw and dividend-adjusted Yahoo OHLC
        run: python -u audit/download_yahoo_ohlc.py

      - name: Upload Yahoo audit supplement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-open-audit-supplement
          path: audit/yahoo_output/
          if-no-files-found: error
          retention-days: 14
